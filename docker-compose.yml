name: ledger-demo

# Telemetry for the four application services (slice 5): OpenTelemetry's standard variables, read by
# both SDKs. The endpoint is the otel-lgtm service below, which runs only under the "telemetry"
# profile: without it the exports fail and are dropped (one warning a minute at most), and the work
# goes on (decision 79), with one exception found: Node resolves the missing otel-lgtm on its thread
# pool, where failing lookups can hold the threads a database connection needs (the slice 5 spec's
# Known gaps; the Node image's larger pool, UV_THREADPOOL_SIZE, mitigates it). Unset the endpoint
# and telemetry is off altogether. Metrics every 10 s (the SDKs' default is 60 s), so a dashboard
# moves while the demo runs. Merged into each service's environment with <<: (YAML's merge key).
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.15.1-alpine
    # -js enables JetStream; -sd is where it persists streams; -m exposes the monitoring port.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      # ?js-enabled-only=true makes /healthz fail unless JetStream is up.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15

  # NATS for the tests, like ledger_test for the database: test events never reach the
  # development stream (or the compose deposit-worker). No volume: test streams needn't survive a
  # restart.
  nats-test:
    image: nats:2.15.1-alpine
    # -n names the server: the e2e tests check for this name before purging its stream.
    command: ["-js", "-sd", "/data", "-m", "8222", "-n", "ledger-demo-test"]
    ports:
      - "4223:4222"
      - "8223:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      # Set as env vars rather than flags so they also apply to ad-hoc
      # `docker compose run --rm migrate <command>` invocations.
      DBMATE_WAIT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # The same migrations against the test database (ledger_test), so tests never touch the
  # development data. dbmate creates the database if it doesn't exist.
  migrate-test:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger_test?sslmode=disable
      DBMATE_WAIT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # The same again for the Go tests' own database (ledger_go_test), so the Node and Go suites
  # never share rows, e.g. unpublished outbox events (slice 3 decision 52).
  migrate-go-test:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger_go_test?sslmode=disable
      DBMATE_WAIT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # And for the Go outbox and relay tests alone (ledger_go_relay_test): claiming takes the oldest
  # unpublished events in the whole table, so those tests mustn't see the other Go tests' events.
  migrate-go-relay-test:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger_go_relay_test?sslmode=disable
      DBMATE_WAIT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # Applies the JetStream definitions in nats/ (streams and consumers) and exits, like migrate
  # does for the schema (see nats/setup.sh).
  nats-setup:
    image: natsio/nats-box:0.20.0
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./nats:/nats:ro
    entrypoint: ["/bin/sh", "/nats/setup.sh"]
    depends_on:
      nats:
        condition: service_healthy

  # The same definitions on the test NATS.
  nats-setup-test:
    image: natsio/nats-box:0.20.0
    environment:
      NATS_URL: nats://nats-test:4222
    volumes:
      - ./nats:/nats:ro
    entrypoint: ["/bin/sh", "/nats/setup.sh"]
    depends_on:
      nats-test:
        condition: service_healthy

  # The four application services run either implementation (slice 3 decision 51): API_IMPL,
  # RELAY_IMPL, DEPOSIT_WORKER_IMPL and SUBMITTER_IMPL, each node (the default) or go, choose the
  # build directory and the image (ledger-demo-node or ledger-demo-go: one image per
  # implementation, every process in it). Both images have the same commands (api, relay,
  # deposit-worker, submitter), so the command, environment, ports and grace periods don't depend
  # on the choice. Export the variables (or put them in .env, which compose reads) for every
  # docker compose command, scripts/demo.sh's included: a command without them recreates the
  # service as Node.
  #
  # init: true runs a minimal init as the container's PID 1, which passes signals on to the
  # process. The kernel ignores a signal sent to PID 1 unless that process handles it, and both
  # implementations stop handling SIGTERM once shutdown begins, so a second SIGTERM can end a slow
  # shutdown at once, as it does outside a container: as PID 1 it would be ignored (measured).
  api: &api
    build: ./${API_IMPL:-node}
    image: ledger-demo-${API_IMPL:-node}
    command: ["api"]
    init: true
    # The API exits with a failing code if it can't start; restart it.
    restart: unless-stopped
    # Postgres only: the API stores events in the outbox and never talks to NATS (the relay
    # publishes them).
    environment:
      <<: *telemetry-env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      PORT: "3000"
      LOG_LEVEL: info
    # No healthcheck: nothing waits on this service (GET /health is there for one).
    # Host port 3000: stop this service (docker compose stop api) before running
    # npm run dev:api on the host, which wants the same port.
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # A second API on the same database, in the implementation API_OTHER_IMPL (go by default;
  # scripts/differential.sh sets it to the opposite of API_IMPL), on host port 3001: only for the
  # differential check of the read endpoints (slice 3 decision 61), so under its own profile;
  # nothing else starts it. The api's settings otherwise (the anchor), port 3000 inside.
  api-other:
    <<: *api
    build: ./${API_OTHER_IMPL:-go}
    image: ledger-demo-${API_OTHER_IMPL:-go}
    ports:
      - "3001:3000"
    profiles: ["differential"]

  # Publishes the outbox to JetStream (src/relay/). Several instances can run at once
  # (docker compose up -d --scale relay=2): each claims its own batches of events.
  relay:
    build: ./${RELAY_IMPL:-node}
    image: ledger-demo-${RELAY_IMPL:-node}
    command: ["relay"]
    init: true
    # Exits with a failing code if it can't start or loses NATS for good; restart it.
    restart: unless-stopped
    # Graceful shutdown finishes the batch in progress first. If NATS is unreachable, each
    # publish in it can take PUBLISH_TIMEOUT_MS (2 s): 10 × 2 s, then up to 5 s to drain NATS.
    # After this, Docker sends SIGKILL (the batch's leases expire and it is published again).
    stop_grace_period: 30s
    environment:
      <<: *telemetry-env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully

  # Books, reviews and posts deposits (src/deposit-worker/). Several instances can run at once
  # (docker compose up -d --scale deposit-worker=3): they share the durable consumer, and each
  # message goes to one of them.
  deposit-worker: &deposit-worker
    build: ./${DEPOSIT_WORKER_IMPL:-node}
    image: ledger-demo-${DEPOSIT_WORKER_IMPL:-node}
    command: ["deposit-worker"]
    init: true
    # Exits with a failing code if it can't start or loses NATS for good; restart it.
    restart: unless-stopped
    # Graceful shutdown can take just over Docker's default 10 s: a waiting fetch is closed at
    # once, then up to 5 s for in-flight messages (SHUTDOWN_GRACE_MS), up to 5 s to drain NATS,
    # then closing the pool. After this, Docker sends SIGKILL (unfinished messages are
    # redelivered either way).
    stop_grace_period: 15s
    environment:
      <<: *telemetry-env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      NATS_URL: nats://nats:4222
      REVIEW_DELAY_MS: "2000"
      APPROVE_RATE: "0.8"
      DEPOSIT_WORKER_CONCURRENCY: "10"
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully

  # Sends each held withdrawal to the provider (src/submitter/). Several instances can run at once
  # (docker compose up -d --scale submitter=2): they share the durable consumer.
  submitter:
    build: ./${SUBMITTER_IMPL:-node}
    image: ledger-demo-${SUBMITTER_IMPL:-node}
    command: ["submitter"]
    init: true
    # Exits with a failing code if it can't start or loses NATS for good; restart it.
    restart: unless-stopped
    # As the deposit-worker: 5 s grace for in-flight submissions, up to 5 s to drain NATS. An
    # unfinished submission is redelivered and sent again with the same key.
    stop_grace_period: 15s
    environment:
      <<: *telemetry-env
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      NATS_URL: nats://nats:4222
      PROVIDER_URL: http://provider-sim:4000
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully
      provider-sim:
        condition: service_started

  # A second deposit-worker on the same durable consumer, in the other implementation, so a Node and
  # a Go worker share the messages (scripts/shared-consumer.sh). The deposit-worker's settings (the
  # YAML anchor above: environment, grace period, dependencies) with its own implementation:
  # DEPOSIT_WORKER_OTHER_IMPL, go by default. Its own variable rather than "the opposite of
  # DEPOSIT_WORKER_IMPL": compose's ${...} has defaults but no conditions, so the script works out
  # the opposite and sets it. The "shared-consumer" profile keeps it out of docker compose up.
  deposit-worker-other:
    <<: *deposit-worker
    build: ./${DEPOSIT_WORKER_OTHER_IMPL:-go}
    image: ledger-demo-${DEPOSIT_WORKER_OTHER_IMPL:-go}
    profiles: ["shared-consumer"]

  # A fake BaaS provider (src/provider-sim/): accepts SEPA transfers idempotently and reports
  # their results to a webhook. Test infrastructure, part of neither implementation (slice 2
  # decision 31). Failures are chosen by triggers in remittance_info (SIM REFUSE, SIM ERROR, …)
  # or by the SIM_*_RATE variables (0, off, by default). State is in memory: a restart forgets
  # every transfer.
  provider-sim:
    build: ./node
    image: ledger-demo-node
    command: ["node", "src/provider-sim/main.ts"]
    restart: unless-stopped
    environment:
      PORT: "4000"
      LOG_LEVEL: info
      SIM_EXECUTION_DELAY_MS: "2000"
      # Each transfer's result goes to the API's webhook, retried until it answers 2xx.
      SIM_WEBHOOK_URL: http://api:3000/provider/transfer-updates
    # Host port 4000, for curl.
    ports:
      - "4000:4000"

  # The telemetry backend (slice 5 decision 78): grafana/otel-lgtm, an OpenTelemetry Collector with
  # Tempo (traces), Prometheus (metrics), Loki (logs) and Grafana in one container, for development
  # only (a Known gap). Under the "telemetry" profile, so docker compose up runs without it, as CI's
  # demo legs do (decision 79): docker compose --profile telemetry up -d adds it. The services send
  # OTLP over HTTP to its port 4318 inside the network; Grafana on host port 3002 (the API has 3000,
  # api-other 3001), sign-in admin / admin. Its data isn't kept: a restart starts empty.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    profiles: ["telemetry"]
    ports:
      - "3002:3000"

  # Reconciliation on demand: docker compose run --rm reconcile [options]. It only reads the
  # shared database, so it checks whichever implementation wrote the data; scripts/demo.sh
  # uses it rather than a script inside the Node image, which the Go implementation won't have.
  # The "tools" profile keeps it out of docker compose up.
  reconcile:
    build: ./node
    image: ledger-demo-node
    entrypoint: ["node", "scripts/reconcile.ts"]
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  natsdata:
