name: ledger-demo

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.15.1-alpine
    # -js enables JetStream; -sd is where it persists streams; -m exposes the monitoring port.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      # ?js-enabled-only=true makes /healthz fail unless JetStream is up.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ghcr.io/amacneil/dbmate:2.36.0
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      # Set as env vars rather than flags so they also apply to ad-hoc
      # `docker compose run --rm migrate <command>` invocations.
      DBMATE_WAIT: "true"
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db:/db
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  # Applies the JetStream stream definitions in nats/streams/ and exits, like migrate does for
  # the schema (see nats/setup.sh).
  nats-setup:
    image: natsio/nats-box:0.20.0
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./nats:/nats:ro
    entrypoint: ["/bin/sh", "/nats/setup.sh"]
    depends_on:
      nats:
        condition: service_healthy

  api:
    build: ./node
    # Named so the worker (later) can reuse the same image with a different command.
    image: ledger-demo-node
    # The API exits with a failing code if it can't start or loses NATS for good; restart it.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
      NATS_URL: nats://nats:4222
      PORT: "3000"
      LOG_LEVEL: info
    # No healthcheck yet (no health endpoint; see Known gaps in the slice spec): nothing waits
    # on this service.
    # Host port 3000: stop this service (docker compose stop api) before running
    # npm run dev:api on the host, which wants the same port.
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-setup:
        condition: service_completed_successfully

volumes:
  pgdata:
  natsdata:
