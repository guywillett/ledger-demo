openapi: 3.1.1
info:
  title: ledger-demo API
  version: 0.1.0
  description: |
    Hand-written contract, shared by the Node and Go implementations. Both are tested against
    it. Amounts are integer minor units as digit strings; IDs are TypeIDs.
    Errors are RFC 9457 problem details (application/problem+json).
paths:
  /provider/incoming-payments:
    post:
      summary: The provider's notification of an incoming payment (its webhook)
      description: |
        Idempotent on (network, network_transaction_id). The real webhook contract (a provider
        retries anything but a 2xx): 204, with no body, for everything recorded or deliberately
        handled: a new deposit (stored with its deposit.created event, published
        asynchronously), a repeat with the same creditor_iban, amount_minor and currency
        (counted), a notification for an IBAN matching none of our accounts (recorded in
        suspense: money can't be refused over HTTP), and one that conflicts with the stored
        deposit (recorded, nothing changed). 400 only for a body that doesn't parse, an invalid
        IBAN included; 500 when a retry can help. The response never says what the
        notification did, so the endpoint can't be used to probe accounts or deposits. Unknown
        fields are ignored (tolerant reader).
      parameters:
        - name: x-request-id
          in: header
          required: false
          description: Reused as the request ID if it matches the pattern; otherwise one is generated.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomingPaymentNotification'
            example:
              network_transaction_id: NTX-2026-0001
              creditor_iban: FR7612345000010000000000193
              provider_account_id: prov_acc_0001
              amount_minor: '1250'
              currency: EUR
              network: SEPA
      responses:
        '204':
          description: Recorded or deliberately handled (whatever it did)
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
        '400':
          description: The body can't be used (malformed, oversized or not JSON) or doesn't parse (an invalid IBAN included)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Not recorded; a retry can help (e.g. once a bug is fixed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /accounts/{account_id}/balance:
    get:
      summary: The account's balances
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Balances in integer minor units, as digit strings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: account_id is not an acct_ ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /accounts/{account_id}/transactions:
    get:
      summary: The account's deposits, newest first, a page at a time
      description: |
        Paginated by seeking on the deposit ID (UUIDv7 IDs sort by creation time): pass the
        previous page's next_before as `before` to get the next, older page.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before
          in: query
          required: false
          description: Only deposits older than this one (a previous page's next_before).
          schema:
            type: string
            pattern: '^dep_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        - name: include
          in: query
          required: false
          description: '`history` adds each deposit''s status history.'
          schema:
            const: history
      responses:
        '200':
          description: A page of deposits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        '400':
          description: Invalid account_id or query parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /accounts/{account_id}/withdrawals:
    post:
      summary: Request a withdrawal (a SEPA transfer out of the account)
      description: |
        Holds the funds at once, in the request's own transaction: 201 means accepted, with the
        amount moved from available to held; 422 means refused for insufficient funds, with
        nothing stored. Idempotent on (account, Idempotency-Key): repeating a request with the
        same key and the same details returns the withdrawal in its current status (200); the
        same key with other details is a 409. Only a successful request takes a key: after a
        400, 404, 422 or 5xx the same key can be used again.

        The body is strict: unknown fields are rejected (unlike the provider webhook POST
        /provider/incoming-payments, which ignores them). creditor_name and remittance_info have
        the separators (space, tab, CR, LF, U+00A0 and U+202F; slice 3 decision 56) trimmed
        from both ends and must use the SEPA basic character set (letters, digits, spaces and
        / - ? : ( ) . , ' +); text outside it is rejected, never transliterated.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: Idempotency-Key
          in: header
          required: true
          description: Chosen by the client, one per intended withdrawal (e.g. a UUID).
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,255}$'
        - name: x-request-id
          in: header
          required: false
          description: Reused as the request ID if it matches the pattern; otherwise one is generated.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
            example:
              amount_minor: '2500'
              currency: EUR
              creditor_iban: DE75512108001245126199
              creditor_name: Jane Doe
              remittance_info: Rent October
      responses:
        '201':
          description: Withdrawal created, funds held (status held)
          headers:
            location:
              description: The withdrawal's URL, /withdrawals/{withdrawal_id}
              schema:
                type: string
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '200':
          description: A repeat of an earlier request (same key and details); the withdrawal in its current status
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '400':
          description: Invalid Idempotency-Key, account_id or body (including an unknown field)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The Idempotency-Key was used for a withdrawal with other details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/IdempotencyKeyConflictProblem'
        '413':
          description: Body too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Unsupported content type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Insufficient available funds; nothing stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Unexpected failure; nothing stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /withdrawals/{withdrawal_id}:
    get:
      summary: A withdrawal in its current status
      parameters:
        - name: withdrawal_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^wd_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        - name: include
          in: query
          required: false
          description: '`history` adds the withdrawal''s status history.'
          schema:
            const: history
      responses:
        '200':
          description: The withdrawal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Withdrawal'
        '400':
          description: withdrawal_id is not a wd_ ID, or an invalid query parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such withdrawal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /provider/transfer-updates:
    post:
      summary: The provider's result for a transfer we sent (its webhook)
      description: |
        Recorded and settled in one transaction: executed moves the held funds out, failed
        releases them. The real webhook contract (a provider retries anything but a 2xx): 204,
        with no body, for everything recorded or deliberately handled (applied, a resent or
        repeated update, a contradiction, an update matching no withdrawal); 400 only for a
        body that doesn't parse; 500 when a retry can help. The response never says what the
        update did, so the endpoint can't be used to probe withdrawals. Unknown fields are
        ignored (tolerant reader).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUpdate'
            example:
              provider_event_id: pev_6b1c9a7e-0d2f-4a31-9c1e-2f4b8e7d5a10
              transfer_id: tr_b705d586-66b2-443b-8f8d-96fe4249aa46
              reference: wd_01m5jjt69mec4t28vcqmrkmf79
              status: executed
              occurred_at: '2026-10-24T09:00:00.000Z'
      responses:
        '204':
          description: Recorded or deliberately handled (whatever it did)
        '400':
          description: The body can't be used (malformed, oversized or not JSON) or doesn't parse
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Not recorded; a retry can help (e.g. once a bug is fixed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        pattern: '^acct_[0-7][0-9a-hjkmnp-tv-z]{25}$'
  headers:
    RequestId:
      description: The request ID used in logs
      schema:
        type: string
  schemas:
    AmountMinor:
      description: Integer minor units (cents) as a string of digits, greater than zero.
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 19
      examples: ['1250']
    SepaAmountMinor:
      description: >-
        An amount in a request or notification: integer minor units (cents) as a string of
        digits, greater than zero and at most the SEPA Credit Transfer maximum, 999,999,999.99
        EUR, so at most 11 digits (EPC SCT Rulebook EPC125-05, 2025 version 1.0, section 4.6.1,
        AT-T002). A larger amount is a 400 (slice 3 decision 60). Amounts in responses use
        AmountMinor.
      type: string
      pattern: '^[1-9][0-9]{0,10}$'
      examples: ['1250']
    IncomingPaymentNotification:
      type: object
      description: Unknown fields are ignored (tolerant reader).
      required: [network_transaction_id, creditor_iban, amount_minor, currency, network]
      properties:
        network_transaction_id:
          type: string
          minLength: 1
          maxLength: 255
        creditor_iban:
          type: string
          description: |
            SEPA IBAN. The separators (space, tab, CR, LF, U+00A0 and U+202F) are removed
            and a-z upper-cased (slice 3 decision 56); every other character must be an ASCII
            letter or digit. At most 64 characters as received, separators included.
          maxLength: 64
          pattern: '^[ \t\r\n\u00a0\u202f]*(?:[A-Za-z0-9][ \t\r\n\u00a0\u202f]*)+$'
        provider_account_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Stored when sent; not used for matching or duplicate detection.
        amount_minor:
          $ref: '#/components/schemas/SepaAmountMinor'
        currency:
          const: EUR
        network:
          const: SEPA
    # The fields of a deposit in an account's transaction list. Transaction closes itself with
    # unevaluatedProperties: false, which (unlike additionalProperties) also counts the
    # properties described through allOf.
    DepositFields:
      type: object
      required:
        - id
        - account_id
        - creditor_iban
        - provider_account_id
        - amount_minor
        - currency
        - network
        - network_transaction_id
        - status
        - notification_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^dep_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        account_id:
          type: string
          pattern: '^acct_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        creditor_iban:
          type: string
          description: Normalised (no separators, upper case).
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
        provider_account_id:
          type: [string, 'null']
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          const: EUR
        network:
          const: SEPA
        network_transaction_id:
          type: string
        status:
          $ref: '#/components/schemas/DepositStatus'
        notification_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Transaction:
      description: A deposit in an account's transaction list.
      type: object
      allOf:
        - $ref: '#/components/schemas/DepositFields'
      properties:
        history:
          description: Present with include=history. Oldest change first.
          type: array
          items:
            $ref: '#/components/schemas/StatusChange'
      unevaluatedProperties: false
    StatusChange:
      type: object
      additionalProperties: false
      required: [from_status, to_status, reason, at]
      properties:
        from_status:
          description: null for the first entry (the deposit was created).
          oneOf:
            - $ref: '#/components/schemas/DepositStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/DepositStatus'
        reason:
          type: [string, 'null']
        at:
          type: string
          format: date-time
    TransactionList:
      type: object
      additionalProperties: false
      required: [deposits, next_before]
      properties:
        deposits:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        next_before:
          description: Pass as `before` for the next page; null on the last page.
          oneOf:
            - type: string
              pattern: '^dep_[0-7][0-9a-hjkmnp-tv-z]{25}$'
            - type: 'null'
    Balance:
      type: object
      additionalProperties: false
      required: [pending_in, available, held, currency]
      properties:
        pending_in:
          description: Booked but not yet credited (under review, or decided and not yet posted).
          $ref: '#/components/schemas/Money'
        available:
          $ref: '#/components/schemas/Money'
        held:
          description: Reserved for withdrawals in flight (held or submitted, not yet settled).
          $ref: '#/components/schemas/Money'
        currency:
          const: EUR
    Money:
      description: Integer minor units as a string of digits (zero allowed).
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 19
    DepositStatus:
      type: string
      enum: [created, received, under_review, approved, rejected, credited, returned]
    SepaText:
      description: |
        The separators (space, tab, CR, LF, U+00A0 and U+202F) are trimmed from both ends
        (slice 3 decision 56); what remains must not be blank and may contain only letters,
        digits, spaces and / - ? : ( ) . , ' + (the SEPA basic character set). Inside, nothing
        is changed. Each field's length limit applies after trimming, so it is stated in the
        field's description rather than as a maxLength, which would apply to the raw value.
      type: string
      pattern: '^[ \t\r\n\u00a0\u202f]*[A-Za-z0-9/?:().,''+-](?:[A-Za-z0-9/?:().,''+ -]*[A-Za-z0-9/?:().,''+-])?[ \t\r\n\u00a0\u202f]*$'
    WithdrawalRequest:
      type: object
      description: Unknown fields are rejected.
      additionalProperties: false
      required: [amount_minor, currency, creditor_iban, creditor_name]
      properties:
        amount_minor:
          $ref: '#/components/schemas/SepaAmountMinor'
        currency:
          const: EUR
        creditor_iban:
          type: string
          description: |
            The destination, a SEPA IBAN. The separators (space, tab, CR, LF, U+00A0 and
            U+202F) are removed and a-z upper-cased (slice 3 decision 56); every other character
            must be an ASCII letter or digit. At most 64 characters as received, separators
            included.
          maxLength: 64
          pattern: '^[ \t\r\n\u00a0\u202f]*(?:[A-Za-z0-9][ \t\r\n\u00a0\u202f]*)+$'
        creditor_name:
          description: Required; at most 70 characters after trimming, not blank.
          $ref: '#/components/schemas/SepaText'
        remittance_info:
          description: |
            Optional reference shown to the recipient, at most 140 characters after trimming (see
            SepaText). Absent, null, empty or only separators all mean none (null in the response).
          type: [string, 'null']
          pattern: '^[ \t\r\n\u00a0\u202f]*(?:[A-Za-z0-9/?:().,''+-](?:[A-Za-z0-9/?:().,''+ -]*[A-Za-z0-9/?:().,''+-])?[ \t\r\n\u00a0\u202f]*)?$'
    Withdrawal:
      type: object
      additionalProperties: false
      required:
        - id
        - account_id
        - idempotency_key
        - amount_minor
        - currency
        - creditor_iban
        - creditor_name
        - remittance_info
        - status
        - failure_reason
        - created_at
        - updated_at
      properties:
        id:
          type: string
          pattern: '^wd_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        account_id:
          type: string
          pattern: '^acct_[0-7][0-9a-hjkmnp-tv-z]{25}$'
        idempotency_key:
          type: string
        amount_minor:
          $ref: '#/components/schemas/AmountMinor'
        currency:
          const: EUR
        creditor_iban:
          type: string
          description: Normalised (no separators, upper case).
          pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'
        creditor_name:
          type: string
          minLength: 1
          maxLength: 70
        remittance_info:
          type: [string, 'null']
          minLength: 1
          maxLength: 140
        status:
          $ref: '#/components/schemas/WithdrawalStatus'
        failure_reason:
          description: Set when the withdrawal failed (status failed); null otherwise.
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        history:
          description: Present with include=history. Oldest change first.
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalStatusChange'
    WithdrawalStatus:
      type: string
      enum: [held, submitted, executed, failed]
    WithdrawalStatusChange:
      type: object
      additionalProperties: false
      required: [from_status, to_status, reason, at]
      properties:
        from_status:
          description: null for the first entry (the withdrawal was created).
          oneOf:
            - $ref: '#/components/schemas/WithdrawalStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/WithdrawalStatus'
        reason:
          type: [string, 'null']
        at:
          type: string
          format: date-time
    TransferUpdate:
      type: object
      description: Unknown fields are ignored (tolerant reader).
      required: [provider_event_id, transfer_id, reference, status, occurred_at]
      properties:
        provider_event_id:
          description: The provider's ID for this update; a resend carries the same one.
          type: string
          minLength: 1
          maxLength: 255
        transfer_id:
          type: string
          minLength: 1
          maxLength: 255
        reference:
          description: Our withdrawal ID as we sent it (a wd_ TypeID).
          type: string
          minLength: 1
          maxLength: 255
        status:
          enum: [executed, failed]
        reason:
          description: Required for failed; must be absent for executed.
          type: string
          minLength: 1
          maxLength: 1000
        occurred_at:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          description: For invalid notifications and requests, one entry per problem found.
          items:
            type: object
            additionalProperties: false
            required: [path, message]
            properties:
              path:
                type: string
              message:
                type: string
    IdempotencyKeyConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [differing_fields]
          properties:
            differing_fields:
              type: array
              description: Names of the stored fields that differ (never their values).
              minItems: 1
              items:
                type: string
                enum: [amount_minor, currency, creditor_iban, creditor_name, remittance_info]
